<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Max Power</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#f5f7fa;
  color:#222;
}

header{
  background:linear-gradient(135deg,#101c2b,#20364a);
  color:white;
  text-align:center;
  padding:35px 15px;
}

header h1{
  margin:0;
  font-size:40px;
}

header p{
  font-size:21px;
  margin:10px 0 0;
}

.slider{
  width:92%;
  max-width:650px;
  margin:35px auto 25px;
  overflow:hidden;
  border-radius:25px;
  background:white;
  padding:10px;
  box-shadow:0 8px 25px rgba(0,0,0,.12);
}

.slides{
  display:flex;
  animation:slide 27s infinite;
}

.slides img{
  width:100%;
  min-width:100%;
  height:580px;
  object-fit:contain;
  border-radius:18px;
}

@keyframes slide{
  0%,10%{transform:translateX(0)}
  12%,21%{transform:translateX(-100%)}
  23%,32%{transform:translateX(-200%)}
  34%,43%{transform:translateX(-300%)}
  45%,54%{transform:translateX(-400%)}
  56%,65%{transform:translateX(-500%)}
  67%,76%{transform:translateX(-600%)}
  78%,87%{transform:translateX(-700%)}
  89%,98%{transform:translateX(-800%)}
  100%{transform:translateX(0)}
}

.card{
  width:92%;
  max-width:650px;
  margin:25px auto;
  background:white;
  padding:30px;
  border-radius:28px;
  box-shadow:0 8px 25px rgba(0,0,0,.08);
  text-align:center;
}

.card h2{
  font-size:34px;
  margin:0 0 15px;
  color:#101c2b;
}

.card p{
  font-size:20px;
  line-height:1.6;
  color:#555;
}

.old-price{
  font-size:24px;
  color:#777;
  text-decoration:line-through;
  margin-top:20px;
}

.price{
  font-size:48px;
  font-weight:bold;
  color:#e51f2a;
  margin:5px 0 20px;
}

.order-btn{
  display:inline-block;
  background:#e51f2a;
  color:white;
  padding:16px 35px;
  border-radius:12px;
  text-decoration:none;
  font-size:21px;
  font-weight:bold;
}

.features{
  text-align:left;
  font-size:18px;
  line-height:2;
  margin-top:20px;
}

form{
  text-align:left;
}

label{
  display:block;
  font-weight:bold;
  margin-top:15px;
  margin-bottom:7px;
}

input,select,textarea{
  width:100%;
  padding:14px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
}

textarea{
  height:100px;
  resize:none;
}

.submit{
  width:100%;
  margin-top:25px;
  padding:17px;
  border:0;
  border-radius:12px;
  background:#0b9b4b;
  color:white;
  font-size:20px;
  font-weight:bold;
}

footer{
  text-align:center;
  padding:30px;
  color:#777;
}

@media(max-width:600px){
  header h1{font-size:34px}
  header p{font-size:18px}
  .slides img{height:480px}
  .price{font-size:42px}
}
</style>
</head>

<body>

<header>
  <h1>💪 MAX POWER</h1>
  <p>Product Information & Order</p>
</header>

<div class="slider">
  <div class="slides">

    <img src="https://i.ibb.co/FqVQ08q6/IMG-20260914-234258-638.jpg">
    <img src="https://i.ibb.co/DBXvn6z/IMG-20260914-234258-695.jpg">
    <img src="https://i.ibb.co/G4vXrDrk/IMG-20260914-234258-636.jpg">
    <img src="https://i.ibb.co/9332Y1kp/IMG-20260914-234258-333.jpg">
    <img src="https://i.ibb.co/S4VmNLSF/IMG-20260914-234258-520.jpg">
    <img src="https://i.ibb.co/M5SMtH1Q/IMG-20260914-234259-203.jpg">
    <img src="https://i.ibb.co/W4Dwkk2Q/IMG-20260914-234259-264.jpg">
    <img src="https://i.ibb.co/k2j0p665/IMG-20260914-234258-899.jpg">
    <img src="https://i.ibb.co/JwrpcFJz/IMG-20260914-234258-534.jpg">

  </div>
</div>

<div class="card">

  <h2>MAX POWER</h2>

  <p>
    Max Power পণ্যের তথ্য দেখুন এবং নিচের ফর্ম পূরণ করে অর্ডার করুন।
  </p>

  <div class="old-price">₹2,200</div>
  <div class="price">₹1,500</div>

  <a href="#order" class="order-btn">🛒 এখনই অর্ডার করুন</a>

  <div class="features">
    ✅ সহজ অর্ডার প্রক্রিয়া<br>
    ✅ Cash on Delivery সুবিধা<br>
    ✅ দ্রুত ডেলিভারি<br>
    ✅ কাস্টমার সাপোর্ট
  </div>

</div>

<div class="card" id="order">

  <h2>🛒 অর্ডার করুন</h2>

  <form action="https://formsubmit.co/maxpower9999000@gmail.com" method="POST">

    <input type="hidden" name="_subject" value="🛒 Max Power - নতুন অর্ডার">
    <input type="hidden" name="_template" value="table">

    <label>👤 নাম</label>
    <input type="text" name="নাম" placeholder="আপনার নাম লিখুন" required>

    <label>📱 মোবাইল</label>
    <input type="tel" name="মোবাইল" placeholder="আপনার মোবাইল নম্বর" required>

    <label>🏠 ঠিকানা</label>
    <textarea name="ঠিকানা" placeholder="সম্পূর্ণ ঠিকানা লিখুন" required></textarea>

    <label>📮 PIN Code</label>
    <input
      type="text"
      name="পিন কোড"
      placeholder="৬ সংখ্যার PIN Code"
      inputmode="numeric"
      maxlength="6"
      pattern="[0-9]{6}"
      required
    >

    <label>📦 পরিমাণ</label>
    <select name="পরিমাণ" required>
      <option value="">পরিমাণ নির্বাচন করুন</option>
      <option value="১টি">১টি</option>
      <option value="২টি">২টি</option>
      <option value="৩টি">৩টি</option>
      <option value="৪টি">৪টি</option>
    </select>

    <button type="submit" class="submit">
      ✅ অর্ডার কনফার্ম করুন
    </button>

  </form>

</div>

<footer>
  © 2026 Max Power
</footer>

</body>
</html>
