<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phone Market</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    color:#111;
}

/* HEADER */
header{
    background:#0879ee;
    color:white;
    padding:18px;
}

.header{
    max-width:1200px;
    margin:auto;
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    font-size:42px;
}

.logoText{
    font-size:36px;
    font-weight:bold;
}

.searchBox{
    max-width:1200px;
    margin:18px auto 0;
    display:flex;
    gap:8px;
}

.searchBox input{
    flex:1;
    padding:15px;
    border:none;
    border-radius:8px;
    font-size:17px;
}

.searchBox button{
    border:none;
    background:#ffc400;
    padding:0 20px;
    border-radius:8px;
    font-size:22px;
}

.cart{
    padding:12px;
    font-weight:bold;
    white-space:nowrap;
}

/* NAV */
nav{
    background:white;
    display:flex;
    overflow-x:auto;
    border-bottom:1px solid #ddd;
}

nav button{
    border:0;
    background:white;
    padding:16px 22px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    white-space:nowrap;
}

nav button.active{
    color:#0879ee;
    border-bottom:3px solid #0879ee;
}

/* MAIN */
.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

/* OFFER */
.offer{
    background:linear-gradient(120deg,#034ea2,#0879ee);
    color:white;
    padding:35px 25px;
    border-radius:18px;
    margin-bottom:25px;
}

.offer h1{
    margin:0 0 10px;
    font-size:38px;
}

.offer p{
    margin:0;
    font-size:20px;
}

/* PRODUCTS */
.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:20px;
}

.card{
    background:white;
    border-radius:15px;
    padding:16px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.phone{
    height:180px;
    background:#edf2f7;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:80px;
}

.brand{
    color:#777;
    margin-top:12px;
}

.name{
    font-size:21px;
    font-weight:bold;
    margin:5px 0;
}

.oldPrice{
    color:#777;
    text-decoration:line-through;
}

.price{
    font-size:23px;
    font-weight:bold;
    margin-top:5px;
}

.offerText{
    color:#e53935;
    font-weight:bold;
    margin:8px 0 15px;
}

.buttons{
    display:flex;
    gap:8px;
}

.buttons button{
    flex:1;
    padding:12px 5px;
    border:none;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.cartBtn{
    background:#e8f2ff;
    color:#0879ee;
}

.buyBtn{
    background:#0879ee;
    color:white;
}

/* MODAL */
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modalBox{
    background:white;
    width:100%;
    max-width:480px;
    padding:25px;
    border-radius:15px;
}

.modalBox h2{
    margin-top:0;
}

.modalBox input,
.modalBox textarea{
    width:100%;
    padding:13px;
    margin:7px 0;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

.modalButtons{
    display:flex;
    gap:10px;
    margin-top:10px;
}

.modalButtons button{
    flex:1;
    padding:13px;
    border:none;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.cancel{
    background:#ddd;
}

.confirm{
    background:#0879ee;
    color:white;
}

/* MOBILE */
@media(max-width:600px){

    .logoText{
        font-size:28px;
    }

    .
