*{

  margin:0;

body{

header{
  background:linear-gradient(135deg,#111827,#263238);
  color:white;

}

header h1{
  font-size:32px;

.container{
  max-width:700px;

/* IMAGE SLIDER */
.slider{
  position:relative;
  width:100%;
  height:430px;
  overflow:hidden;
  border-radius:20px;
  background:white;
  box-shadow:0 8px 25px rgba(0,0,0,.12);
}

.slide{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:contain;
  opacity:0;
  animation:slideShow 27s infinite;
  padding:10px;
}

.slide:nth-child(1){animation-delay:0s}
.slide:nth-child(2){animation-delay:3s}
.slide:nth-child(3){animation-delay:6s}
.slide:nth-child(4){animation-delay:9s}
.slide:nth-child(5){animation-delay:12s}
.slide:nth-child(6){animation-delay:15s}
.slide:nth-child(7){animation-delay:18s}
.slide:nth-child(8){animation-delay:21s}
.slide:nth-child(9){animation-delay:24s}

@keyframes slideShow{
  0%{opacity:0}
  5%{opacity:1}
  11%{opacity:1}
  16%{opacity:0}
  100%{opacity:0}
}

.card{
  background:white;
  margin-top:20px;
  padding:24px;
  border-radius:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

h2{
  text-align:center;
  color:#111827;
  margin-bottom:12px;
}

.description{
  text-align:center;
  line-height:1.7;
  color:#555;
}

.price{
  text-align:center;
  font-size:30px;
  font-weight:bold;
  color:#e53935;
  margin:18px 0;
}

.features{
  margin-top:15px;
}

.features p{
  background:#f1f8e9;
  padding:11px;
  margin:8px 0;
  border-radius:10px;
}

.order-title{
  text-align:center;
  color:#111827;
  margin-bottom:18px;
}

label{
  display:block;
  font-weight:bold;
  margin:13px 0 6px;
}

input,select,textarea{
  width:100%;
  padding:14px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
  outline:none;
}

input:focus,select:focus,textarea:focus{
  border-color:#2196f3;
}

button{
  width:100%;
  margin-top:22px;
  padding:16px;
  border:0;
  border-radius:12px;
  background:linear-gradient(135deg,#16a34a,#15803d);
  color:white;
  font-size:19px;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.note{
  text-align:center;
  margin-top:12px;
  font-size:13px;
  color:#777;
}

footer{
  text-align:center;
  padding:25px 10px;
  color:#777;
  font-size:13px;
}

@media(max-width:500px){
  .slider{
    height:350px;
  }

  header h1{
    font-size:28px;
  }

  .card{
    padding:18px;
  }
}
</style>
