<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MAX POWER</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#f5f7f8;
  color:#17202a;
  overflow-x:hidden;
}

/* ===== HEADER ===== */

header{
  position:relative;
  overflow:hidden;
  text-align:center;
  color:white;
  padding:22px 15px 25px;
  background:
    radial-gradient(circle at 20% 10%,rgba(255,210,70,.20),transparent 25%),
    radial-gradient(circle at 90% 80%,rgba(0,255,170,.12),transparent 30%),
    linear-gradient(135deg,#06120d,#0b2418,#07110c);
}

header:before{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  border-radius:50%;
  background:rgba(255,193,7,.08);
  filter:blur(12px);
  top:-80px;
  left:-50px;
  animation:floatGlow 5s infinite ease-in-out;
}

header:after{
  content:"";
  position:absolute;
  width:160px;
  height:160px;
  border-radius:50%;
  background:rgba(0,255,170,.07);
  filter:blur(15px);
  right:-50px;
  bottom:-70px;
  animation:floatGlow 6s infinite ease-in-out reverse;
}

.logo{
  position:relative;
  z-index:2;
  font-size:31px;
  font-weight:900;
  letter-spacing:2px;
  text-shadow:0 0 20px rgba(255,193,7,.35);
}

.tagline{
  position:relative;
  z-index:2;
  margin-top:6px;
  font-size:13px;
  opacity:.88;
}

/* ===== LIKE ===== */

.like-box{
  position:relative;
  z-index:3;
  display:inline-flex;
  align-items:center;
  gap:8px;
  margin-top:15px;
  padding:7px 13px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:30px;
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(10px);
}

.like-btn{
  border:0;
  background:none;
  color:white;
  font-weight:bold;
  cursor:pointer;
  padding:5px;
}

.like-count{
  font-weight:bold;
  min-width:20px;
}

.like-pop{
  animation:likePop .4s ease;
}

/* ===== MAIN ===== */

.container{
  width:min(94%,720px);
  margin:auto;
  padding-bottom:100px;
}

/* ===== IMAGE SLIDER ===== */

.slider-card{
  position:relative;
  margin-top:15px;
  padding:9px;
  background:white;
  border-radius:23px;
  box-shadow:0 12px 35px rgba(0,0,0,.14);
  animation:fadeUp .7s ease;
}

.slider{
  position:relative;
  height:390px;
  overflow:hidden;
  border-radius:17px;
  background:#f4f5f6;
}

.slide{
  display:none;
  width:100%;
  height:100%;
}

.slide.active{
  display:block;
  animation:slideEffect .65s ease;
}

.slide img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.arrow{
  position:absolute;
  z-index:5;
  top:50%;
  transform:translateY(-50%);
  width:44px;
  height:44px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.55);
  color:white;
  font-size:29px;
  cursor:pointer;
  backdrop-filter:blur(5px);
  transition:.25s;
}

.arrow:hover{
  transform:translateY(-50%) scale(1.1);
  background:rgba(0,0,0,.75);
}

.prev{
  left:10px;
}

.next{
  right:10px;
}

.dots{
  position:absolute;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:5px;
}

.dot{
  width:7px;
  height:7px;
  background:rgba(0,0,0,.25);
  border-radius:10px;
}

.dot.active{
  width:20px;
  background:#111;
}

/* ===== PRODUCT ===== */

.card{
  margin-top:17px;
  padding:22px 18px;
  background:white;
  border-radius:23px;
  box-shadow:0 10px 32px rgba(0,0,0,.09);
  animation:fadeUp .8s ease;
}

.badge{
  display:inline-block;
  padding:6px 12px;
  border-radius:20px;
  background:#fff3cd;
  color:#795600;
  font-size:12px;
  font-weight:bold;
}

h1{
  margin-top:10px;
  font-size:29px;
  font-weight:900;
}

.desc{
  margin-top:8px;
  font-size:14px;
  line-height:1.6;
  color:#68737c;
}

/* ===== PRICE ===== */

.price-area{
  margin-top:18px;
  padding:17px;
  text-align:center;
  border-radius:17px;
  background:linear-gradient(135deg,#fff9e5,#fff);
  border:1px solid #efdda1;
}

.old-price{
  color:#8a929a;
  text-decoration:line-through;
  font-size:18px;
}

.current-price{
  margin-top:2px;
  color:#d39800;
  font-size:40px;
  font-weight:900;
  animation:pricePulse 2.5s infinite;
}

.offer{
  margin-top:6px;
  color:#08733e;
  font-size:14px;
  font-weight:bold;
  animation:softPulse 2s infinite;
}

/* ===== SECTION TITLE ===== */

.section-title{
  margin-top:21px;
  margin-bottom:10px;
  font-size:17px;
  font-weight:900;
}

/* ===== PLAN ===== */

.plan-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px;
}

.plan{
  position:relative;
  padding:16px 10px;
  text-align:center;
  border:2px solid #e1e5e8;
  border-radius:17px;
  cursor:pointer;
  transition:.3s;
  background:#fff;
}

.plan:hover{
  transform:translateY(-3px);
}

.plan.active{
  border-color:#dda400;
  background:#fff9e7;
  box-shadow:0 7px 20px rgba(218,157,0,.15);
}

.plan.active:after{
  content:"✓";
  position:absolute;
  top:6px;
  right:9px;
  color:#d39400;
  font-weight:900;
}

.plan-title{
  font-size:17px;
  font-weight:900;
}

.plan-price{
  margin-top:5px;
  font-size:24px;
  color:#d39400;
  font-weight:900;
}

.plan-small{
  margin-top:4px;
  color:#777;
  font-size:11px;
}

/* ===== QUANTITY ===== */

.quantity{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:17px;
  margin-top:12px;
}

.qbtn{
  width:43px;
  height:43px;
  border:0;
  border-radius:50%;
  background:#111b25;
  color:white;
  font-size:24px;
  cursor:pointer;
  transition:.2s;
}

.qbtn:active{
  transform:scale(.85);
}

.qnumber{
  min-width:35px;
  text-align:center;
  font-size:22px;
  font-weight:900;
}

/* ===== TOTAL ===== */

.total{
  margin-top:15px;
  padding:15px;
  text-align:center;
  border-radius:15px;
  background:#07140d;
  color:white;
}

.total-label{
  font-size:12px;
  opacity:.75;
}

.total-price{
  margin-top:3px;
  color:#ffd65a;
  font-size:31px;
  font-weight:900;
}

/* ===== BUTTON ===== */

.order-btn{
  width:100%;
  margin-top:17px;
  padding:16px;
  border:0;
  border-radius:15px;
  background:linear-gradient(135deg,#e5a500,#ffd344);
  color:#151515;
  font-size:18px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 8px 25px rgba(211,151,0,.28);
  animation:buttonGlow 2.5s infinite;
  transition:.25s;
}

.order-btn:hover{
  transform:translateY(-2px);
}

.order-btn:active{
  transform:scale(.98);
}

/* ===== FEATURES ===== */

.features{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:16px;
}

.feature{
  padding:13px 9px;
  text-align:center;
  border-radius:13px;
  background:#f5f7f8;
  font-size:12px;
  font-weight:bold;
}

/* ===== FORM ===== */

.form-card{
  margin-top:17px;
  padding:21px 17px;
  background:white;
  border-radius:23px;
  box-shadow:0 10px 32px rgba(0,0,0,.09);
}

.form-card h2{
  font-size:22px;
}

.form-sub{
  margin-top:5px;
  color:#727c84;
  font-size:13px;
}

label{
  display:block;
  margin-top:14px;
  margin-bottom:6px;
  font-size:13px;
  font-weight:bold;
}

input[type="text"],
input[type="tel"],
input[type="file"],
textarea{
  width:100%;
  padding:13px;
  border:1px solid #d8dee3;
  border-radius:12px;
  background:#fafbfc;
  outline:none;
  font-size:14px;
  transition:.25s;
}

input:focus,
textarea:focus{
  border-color:#dba300;
  background:white;
  box-shadow:0 0 0 3px rgba(219,163,0,.10);
}

textarea{
  min-height:90px;
  resize:vertical;
}

/* ===== MEDICINE ===== */

.info-box{
  margin-top:16px;
  padding:14px;
  border-radius:14px;
  background:#f6f8f9;
}

.check{
  display:flex;
  align-items:center;
  gap:9px;
  margin-top:9px;
  font-size:13px;
}

.check input{
  width:17px;
  height:17px;
  accent-color:#d99d00;
}

/* ===== SUMMARY ===== */

.summary{
  margin-top:15px;
  padding:12px;
  border-radius:12px;
  background:#fff8df;
  font-size:13px;
  font-weight:bold;
  line-height:1.7;
}

/* ===== PHOTO ===== */

.preview{
  display:none;
  margin-top:11px;
  text-align:center;
}

.preview img{
  max-width:100%;
  max-height:230px;
  border-radius:15px;
  box-shadow:0 5px 20px rgba(0,0,0,.13);
  animation:photoPop .4s ease;
}

.remove-photo{
  margin-top:8px;
  border:0;
  padding:7px 12px;
  border-radius:9px;
  background:#eee;
  cursor:pointer;
  font-size:12px
