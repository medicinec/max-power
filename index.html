<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Phone Market — Online Mobile Store</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,system-ui,sans-serif;
 background:#f5f7fb;
 color:#172033
}

header{
 background:#2874f0;
 color:white;
 position:sticky;
 top:0;
 z-index:10
}

.top{
 max-width:1200px;
 margin:auto;
 padding:12px 16px;
 display:flex;
 align-items:center;
 gap:18px
}

.logo{
 font-size:24px;
 font-weight:800;
 white-space:nowrap
}

.tag{
 font-size:11px;
 opacity:.9
}

.search{
 flex:1;
 display:flex
}

.search input{
 width:100%;
 padding:12px 14px;
 border:0;
 border-radius:4px 0 0 4px;
 font-size:15px
}

.search button{
 border:0;
 padding:0 18px;
 background:#ffca28;
 cursor:pointer;
 font-size:18px;
 border-radius:0 4px 4px 0
}

.cart{
 font-weight:700;
 white-space:nowrap
}

.nav{
 background:white;
 box-shadow:0 2px 8px #00000012
}

.navin{
 max-width:1200px;
 margin:auto;
 display:flex;
 gap:24px;
 padding:13px 16px;
 overflow:auto
}

.nav a{
 color:#172033;
 text-decoration:none;
 white-space:nowrap;
 font-weight:600
}

.hero{
 max-width:1200px;
 margin:18px auto;
 padding:28px 20px;
 border-radius:12px;
 background:linear-gradient(120deg,#173b91,#2874f0);
 color:white;
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:20px
}

.hero h1{
 margin:0 0 8px;
 font-size:32px
}

.hero p{
 margin:5px 0
}

.deal{
 background:white;
 color:#173b91;
 border-radius:10px;
 padding:14px 20px;
 text-align:center;
 min-width:180px
}

.time{
 font-size:25px;
 font-weight:800;
 margin-top:5px
}

.wrap{
 max-width:1200px;
 margin:0 auto;
 padding:0 16px 30px
}

.title{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin:20px 0 12px
}

.title h2{
 margin:0
}

.grid{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:14px
}

.card{
 background:white;
 border-radius:10px;
 padding:14px;
 box-shadow:0 2px 8px #0000000c;
 position:relative
}

.badge{
 position:absolute;
 top:10px;
 left:10px;
 background:#e53935;
 color:white;
 padding:5px 8px;
 border-radius:4px;
 font-size:11px;
 font-weight:700
}

.pic{
 height:190px;
 display:flex;
 align-items:center;
 justify-content:center;
 background:#fafafa;
 border-radius:8px;
 margin-bottom:10px
}

.pic img{
 max-width:90%;
 max-height:180px;
 object-fit:contain
}

.name{
 font-weight:700;
 min-height:42px
}

.spec{
 font-size:12px;
 color:#667085;
 margin:5px 0
}

.old{
 text-decoration:line-through;
 color:#8a93a3;
 font-size:13px
}

.price{
 font-size:20px;
 font-weight:800;
 margin:3px 0
}

.off{
 color:#159447;
 font-size:13px;
 font-weight:700
}

.actions{
 display:flex;
 gap:8px;
 margin-top:10px
}

.actions button{
 flex:1;
 padding:10px;
 border:0;
 border-radius:6px;
 font-weight:700;
 cursor:pointer
}

.cartbtn{
 background:#ffb300
}

.buybtn{
 background:#2874f0;
 color:white
}

.note{
 font-size:12px;
 color:#667085;
 text-align:center;
 margin-top:20px
}

footer{
 background:#172033;
 color:white;
 padding:25px 16px;
 text-align:center
}

@media(max-width:850px){

 .grid{
  grid-template-columns:repeat(2,1fr)
 }

 .hero{
  margin:12px
 }

 .hero h1{
  font-size:25px
 }

 .deal{
  min-width:150px
 }
}

@media(max-width:560px){

 .top{
  flex-wrap:wrap;
  gap:10px
 }

 .logo{
  width:100%
 }

 .search{
  order:2;
  width:100%
 }

 .cart{
  font-size:13px
 }

 .hero{
  flex-direction:column;
  align-items:stretch
 }

 .deal{
  min-width:0
 }

 .grid{
  grid-template-columns:repeat(2,1fr);
  gap:9px
 }

 .card{
  padding:9px
 }

 .pic{
  height:145px
 }

 .pic img{
  max-height:135px
 }

 .name{
  font-size:14px
 }

 .price{
  font-size:17px
 }

 .actions{
  flex-direction:column
 }

 .navin{
  gap:16px
 }
}
</style>
</head>

<body>

<header>

<div class="top">

<div class="logo">
📱 Phone Market
<div class="tag">Smartphones • Great Deals</div>
</div>

<div class="search">

<input
id="search"
placeholder="Search phones, brands..."
oninput="filterProducts()"
>

<button>🔍</button>

</div>

<div class="cart">
🛒 Cart (<span id="cartCount">0</span>)
</div>

</div>

</header>


<nav class="nav">

<div class="navin">

<a href="#" onclick="showBrand('all')">
All Phones
</a>

<a href="#" onclick="showBrand('Apple')">
iPhone
</a>

<a href="#" onclick="showBrand('Samsung')">
Samsung
</a>

<a href="#" onclick="showBrand('OnePlus')">
OnePlus
</a>

<a href="#" onclick="showBrand('Vivo')">
Vivo
</a>

<a href="#" onclick="showBrand('Oppo')">
Oppo
</a>

<a href="#" onclick="showBrand('Xiaomi')">
Xiaomi
</a>

</div>

</nav>


<section class="hero">

<div>

<h1>🔥 Mega Phone Deals</h1>

<p
