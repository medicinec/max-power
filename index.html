<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phone Market | Mobile Store</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f3f6;color:#172033}
header{background:#2874f0;color:white;padding:12px 4%}
.head{max-width:1200px;margin:auto;display:flex;gap:15px;align-items:center;flex-wrap:wrap}
.logo{font-size:25px;font-weight:bold;white-space:nowrap}
.search{flex:1;display:flex;min-width:220px}
.search input{width:100%;padding:12px;border:0;border-radius:4px 0 0 4px;font-size:15px}
.search button{border:0;background:#ffca28;padding:0 18px;border-radius:0 4px 4px 0}
.cart{font-weight:bold;white-space:nowrap}

nav{background:white;padding:13px;box-shadow:0 2px 5px #0002}
.nav{max-width:1200px;margin:auto;display:flex;gap:25px;overflow:auto}
.nav button{border:0;background:none;font-weight:bold;cursor:pointer;white-space:nowrap}

.hero{max-width:1200px;margin:18px auto;padding:28px;border-radius:12px;background:linear-gradient(120deg,#143d91,#2874f0);color:white;display:flex;justify-content:space-between;align-items:center}
.hero h1{margin:0 0 8px;font-size:32px}
.timer{background:white;color:#173b91;padding:15px 22px;border-radius:10px;text-align:center;font-size:25px;font-weight:bold}

.container{max-width:1200px;margin:auto;padding:0 15px 40px}
h2{margin-top:25px}

.products{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
.card{background:white;padding:12px;border-radius:10px;box-shadow:0 2px 8px #0001;position:relative}
.offer{position:absolute;top:10px;left:10px;background:#e53935;color:white;padding:5px 8px;border-radius:4px;font-size:12px;font-weight:bold}
.photo{height:210px;background:#fafafa;border-radius:8px;display:flex;align-items:center;justify-content:center}
.photo img{max-width:95%;max-height:200px;object-fit:contain}
.name{font-weight:bold;font-size:17px;margin-top:10px}
.spec{color:#667085;font-size:13px;margin:6px 0}
.old{text-decoration:line-through;color:#777}
.price{font-size:21px;font-weight:bold;margin:4px 0}
.discount{color:#078b43;font-weight:bold}
.offertext{background:#fff4d6;padding:7px;border-radius:5px;margin-top:8px;font-size:13px;font-weight:bold}
.buttons{display:flex;gap:7px;margin-top:10px}
.buttons button{flex:1;border:0;padding:11px;border-radius:6px;font-weight:bold;cursor:pointer}
.add{background:#ffb300}
.buy{background:#2874f0;color:white}

#checkout{display:none;background:white;padding:20px;border-radius:10px;margin-top:25px}
#checkout input,#checkout textarea{width:100%;padding:12px;margin:7px 0;border:1px solid #ccc;border-radius:5px}
.orderbtn{background:#159447;color:white;border:0;padding:13px 20px;border-radius:6px;font-weight:bold;width:100%}

footer{background:#172033;color:white;text-align:center;padding:25px;margin-top:30px}

@media(max-width:900px){.products{grid-template-columns:repeat(3,1fr)}}
@media(max-width:650px){
.products{grid-template-columns:repeat(2,1fr);gap:9px}
.hero{margin:10px;display:block}
.timer{margin-top:15px}
.photo{height:150px}
.photo img{max-height:140px}
.name{font-size:14px}
.price{font-size:18px}
.buttons{display:block}
.buttons button{width:100%;margin-top:5px}
}
</style>
</head>

<body>

<header>
<div class="head">
<div class="logo">📱 Phone Market</div>

<div class="search">
<input id="search" placeholder="ফোন বা ব্র্যান্ড খুঁজুন..." oninput="searchProducts()">
<button>🔍</button>
</div>

<div class="cart">🛒 Cart: <span id="cart">0</span></div>
</div>
</header>

<nav>
<div class="nav">
<button onclick="filterBrand('all')">সব ফোন</button>
<button onclick="filterBrand('Apple')">Apple</button>
<button onclick="filterBrand('Samsung')">Samsung</button>
<button onclick="filterBrand('OnePlus')">OnePlus</button>
<button onclick="filterBrand('Vivo')">Vivo</button>
<button onclick="filterBrand('Oppo')">Oppo</button>
<button onclick="filterBrand('Xiaomi')">Xiaomi</button>
</div>
</nav>

<section class="hero">
<div>
<h1>🔥 Phone Market Mega Offer</
